<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>תצוגת הדגמה — דוליטל</title>
    <style>
      :root {
        --lime: #d6f25c;
        --moss: #3d6b16;
        --charcoal: #1e2420;
        --ink: #1a211c;
        --muted: #4d5852;
        --paper: #f3f0e8;
        --card: #fffcf7;
        --sand: #e4ddd0;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        color: var(--ink);
        background:
          radial-gradient(circle at 100% 0%, rgb(214 242 92 / 0.35), transparent 28rem),
          var(--paper);
        font-family: "Arial Hebrew", Arial, sans-serif;
      }
      header, main { width: min(960px, calc(100% - 2rem)); margin-inline: auto; }
      .banner {
        background: var(--charcoal);
        color: white;
        text-align: center;
        padding: 0.75rem 1rem;
        font-weight: 800;
      }
      .top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 1rem;
        padding: 1.25rem 0 0.5rem;
      }
      .mark { display: flex; align-items: center; gap: 0.7rem; font-weight: 800; }
      .paw {
        width: 2.6rem;
        height: 2.6rem;
        border-radius: 999px;
        background: var(--lime);
        color: var(--charcoal);
        display: grid;
        place-items: center;
      }
      .paw svg { width: 1.5rem; height: 1.5rem; }
      nav { display: flex; flex-wrap: wrap; gap: 0.45rem; padding-bottom: 1rem; }
      nav button, .btn {
        border: 0;
        border-radius: 999px;
        min-height: 2.7rem;
        padding: 0.55rem 0.95rem;
        font-weight: 800;
        background: white;
        color: var(--charcoal);
        cursor: pointer;
      }
      nav button[aria-current="page"], .btn.primary { background: var(--lime); }
      .btn:disabled, nav button:disabled { cursor: not-allowed; opacity: 0.55; }
      .card {
        background: var(--card);
        border: 1px solid var(--sand);
        border-radius: 1.6rem;
        padding: 1.1rem 1.2rem;
        margin-bottom: 0.9rem;
      }
      h1 { font-size: 1.8rem; margin: 0.2rem 0; }
      h2 { margin: 0.2rem 0 0.4rem; }
      p { line-height: 1.5; }
      .muted { color: var(--muted); }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.7rem; }
      .stat { font-size: 2rem; font-weight: 800; margin: 0.2rem 0; }
      .row { display: flex; justify-content: space-between; gap: 0.7rem; align-items: center; padding: 0.7rem 0; border-top: 1px solid var(--sand); }
      .pill { border-radius: 999px; background: var(--paper); padding: 0.2rem 0.55rem; font-size: 0.85rem; font-weight: 700; }
      .notice { background: #fff6d8; border-radius: 1rem; padding: 0.75rem 0.9rem; font-weight: 700; }
      select, input[type="file"] { width: 100%; border-radius: 1rem; border: 1px solid var(--sand); padding: 0.7rem; background: white; }
      .meter { height: 0.7rem; background: var(--sand); border-radius: 999px; overflow: hidden; }
      .meter span { display: block; height: 100%; background: var(--lime); width: 40%; }
      @media (max-width: 700px) { .stats { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <p class="banner">תצוגת הדגמה — הנתונים אינם אמיתיים</p>
    <header>
      <div class="top">
        <div class="mark">
          <span class="paw" aria-hidden="true">
            <svg viewBox="0 0 64 64">
              <circle cx="14" cy="22" r="7" fill="currentColor"></circle>
              <circle cx="30" cy="12" r="7" fill="currentColor"></circle>
              <circle cx="48" cy="20" r="7" fill="currentColor"></circle>
              <circle cx="20" cy="36" r="5.5" fill="currentColor"></circle>
              <path d="M34 30c8 0 18 7 18 16 0 8-6 12-14 12H28c-9 0-16-5-16-13 0-9 8-15 22-15z" fill="currentColor"></path>
            </svg>
          </span>
          <span>דוליטל<br />מועדון המנצחים</span>
        </div>
        <span class="pill">עובד תצוגה</span>
      </div>
      <nav>
        <button type="button" data-screen="dashboard">לוח</button>
        <button type="button" data-screen="competition">תחרות</button>
        <button type="button" data-screen="leaderboard">דירוג</button>
        <button type="button" data-screen="rewards">פרסים</button>
        <button type="button" data-screen="manage">ניהול</button>
      </nav>
    </header>
    <main id="app"></main>
    <script>
      const people = [
        { name: "עובד תצוגה", store: "הדגמה תצוגה", score: 120 },
        { name: "בדיקת תצוגה ב", store: "הדגמה שנייה", score: 40 },
        { name: "בדיקת תצוגה ג", store: "הדגמה תצוגה", score: 40 },
      ];
      const rewards = [
        { name: "קפה לדוגמה", cost: 40, stock: 5 },
        { name: "שובר לדוגמה", cost: 60, stock: 5 },
        { name: "סוף שבוע לדוגמה", cost: 200, stock: 2 },
      ];
      const steps = [
        { title: "סניפים", body: "הסניף בתצוגה הוא הדגמה תצוגה. זו לא רשימת הסניפים האמיתית." },
        { title: "עובדים", body: "שלושת השמות כאן בדויים. אין כאן חשבונות, סיסמאות, או כניסה אמיתית." },
        { title: "תחרות", body: "תחרות תצוגה פעילה לאוקטובר 2026. אישור אוטומטי כבוי, ואי אפשר להדליק אותו במסך הזה." },
        { title: "קבלה", body: "העלאת קבלה כבויה. אין כאן קובץ, אין זיהוי תווים, ואין נקודות חדשות." },
      ];
      const state = { screen: "dashboard", balance: 80, requests: [], store: "all", step: 0, notice: "" };

      function ranks() {
        const sorted = [...people].sort((a, b) => b.score - a.score || a.name.localeCompare(b.name, "he"));
        let last = null;
        let rank = 0;
        return sorted.map((person, index) => {
          if (person.score !== last) rank = index + 1;
          last = person.score;
          return { ...person, rank };
        });
      }

      function esc(value) {
        return String(value).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
      }

      function render() {
        const root = document.querySelector("#app");
        const ranked = ranks();
        const me = ranked.find((person) => person.name === "עובד תצוגה");
        const visible = state.store === "all" ? ranked : ranked.filter((person) => person.store === state.store);
        const next = rewards.find((reward) => reward.cost > state.balance);
        let body = "";
        if (state.screen === "dashboard") {
          body = `
            <article class="card">
              <p class="muted">הדגמה תצוגה</p>
              <h1>שלום, עובד תצוגה</h1>
              <p>ניקוד התחרות ונקודות הפרסים נפרדים. כל מספר במסך הזה בדוי, והלחיצות לא נשמרות.</p>
            </article>
            <article class="card">
              <p class="muted">התחרות הנוכחית</p>
              <h2>תחרות תצוגה</h2>
              <p class="muted">1 באוקטובר 2026 עד 31 באוקטובר 2026</p>
            </article>
            <div class="stats">
              <article class="card"><p class="muted">נקודות תחרות</p><p class="stat">${me.score}</p><p>מקום ${me.rank}</p></article>
              <article class="card"><p class="muted">מקום בדירוג</p><p class="stat">${me.rank}</p><p>מתוך ${ranked.length}</p></article>
              <article class="card"><p class="muted">נקודות לפרסים</p><p class="stat">${state.balance}</p><p>נשמרות רק בדפדפן הזה</p></article>
            </div>
            <article class="card">
              <p>${next ? `הפרס הבא: ${esc(next.name)}, ${next.cost} נקודות` : "יש מספיק נקודות לכל פרס בדוי."}</p>
              <div class="meter"><span style="width:${next ? Math.min(100, Math.round((state.balance / next.cost) * 100)) : 100}%"></span></div>
            </article>`;
        } else if (state.screen === "competition") {
          body = `
            <article class="card">
              <h1>תחרות תצוגה</h1>
              <p>נקודה אחת ליחידה. המכפיל ליחידות באריזה הוא 1 עד שהבעלים מגדיר אחרת. אישור אוטומטי כבוי.</p>
              <p class="muted">שינוי החוקים במסך הזה לא משנה את היישום האמיתי.</p>
            </article>`;
        } else if (state.screen === "leaderboard") {
          body = `
            <article class="card">
              <h1>דירוג</h1>
              <label>סינון סניף, מדומה
                <select id="store">
                  <option value="all">כל הסניפים</option>
                  <option value="הדגמה תצוגה">הדגמה תצוגה</option>
                  <option value="הדגמה שנייה">הדגמה שנייה</option>
                </select>
              </label>
              ${visible.map((person) => `<div class="row"><span>${esc(person.name)} · ${esc(person.store)}</span><strong>מקום ${person.rank} · ${person.score}</strong></div>`).join("")}
              <p class="muted">המקום הוא המקום הכללי. הסינון רק מסתיר שורות.</p>
            </article>`;
        } else if (state.screen === "rewards") {
          body = `
            <article class="card">
              <h1>פרסים</h1>
              <p>יש ${state.balance} נקודות פנויות. בקשה כאן מורידה נקודות רק בתצוגה הזו.</p>
              ${state.notice ? `<p class="notice">${esc(state.notice)}</p>` : ""}
              ${rewards.map((reward, index) => {
                const affordable = state.balance >= reward.cost;
                return `<div class="row"><div><strong>${esc(reward.name)}</strong><p class="muted">${reward.cost} נקודות · דוגמה</p></div><button class="btn primary" type="button" data-reward="${index}" ${affordable ? "" : "disabled"}>${affordable ? "בקשה מדומה" : "חסרות נקודות"}</button></div>`;
              }).join("")}
              <h2>הבקשות שלי</h2>
              ${state.requests.length ? state.requests.map((item) => `<p>${esc(item)}</p>`).join("") : `<p class="muted">עדיין אין בקשות מדומות.</p>`}
            </article>`;
        } else {
          const step = steps[state.step];
          body = `
            <article class="card">
              <p class="pill">סיור ניהול מדומה · ${state.step + 1} מתוך ${steps.length}</p>
              <h1>${esc(step.title)}</h1>
              <p>${esc(step.body)}</p>
              ${state.step === 3 ? `<label>קובץ קבלה<input type="file" disabled /><p class="muted">הכפתור כבוי בכוונה.</p></label>` : ""}
              <p>
                <button class="btn" type="button" id="prev" ${state.step === 0 ? "disabled" : ""}>הקודם</button>
                <button class="btn primary" type="button" id="next" ${state.step === steps.length - 1 ? "disabled" : ""}>הבא</button>
              </p>
              <p class="notice">זה אינו מסך הניהול האמיתי. אין שמירה, אין הרשאות, ואין חיבור לוואטסאפ או לזיהוי תווים.</p>
            </article>`;
        }
        root.innerHTML = body;
        document.querySelectorAll("nav button").forEach((button) => {
          button.setAttribute("aria-current", button.dataset.screen === state.screen ? "page" : "false");
        });
        const store = document.querySelector("#store");
        if (store) {
          store.value = state.store;
          store.addEventListener("change", () => { state.store = store.value; render(); });
        }
        document.querySelectorAll("[data-reward]").forEach((button) => {
          button.addEventListener("click", () => {
            const reward = rewards[Number(button.dataset.reward)];
            if (state.balance < reward.cost) return;
            state.balance -= reward.cost;
            state.requests.unshift(`${reward.name} · בקשה מדומה`);
            state.notice = "הבקשה מדומה. שום דבר לא נשמר ולא נשלח.";
            render();
          });
        });
        document.querySelector("#prev")?.addEventListener("click", () => { state.step -= 1; render(); });
        document.querySelector("#next")?.addEventListener("click", () => { state.step += 1; render(); });
      }

      document.querySelectorAll("nav button").forEach((button) => {
        button.addEventListener("click", () => { state.screen = button.dataset.screen; state.notice = ""; render(); });
      });
      render();
    </script>
  </body>
</html>
