<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>תצוגת הדגמה — דוליטל</title>
    <style>
      :root { --lime:#d6f25c; --moss:#3d6b16; --charcoal:#1e2420; --ink:#1a211c; --muted:#4d5852; --paper:#f3f0e8; --card:#fffcf7; --sand:#e4ddd0; --warn:#8a5a12; }
      * { box-sizing: border-box; }
      body { margin:0; color:var(--ink); background:radial-gradient(circle at 100% 0%, rgb(214 242 92 / .35), transparent 28rem), var(--paper); font-family:"Arial Hebrew", Arial, sans-serif; }
      .banner { background:var(--charcoal); color:#fff; text-align:center; padding:.7rem 1rem; font-weight:800; }
      header, main { width:min(720px, calc(100% - 1.5rem)); margin-inline:auto; }
      .top { display:flex; justify-content:space-between; align-items:center; padding:1rem 0; }
      nav { display:grid; grid-template-columns:1fr 1fr; gap:.4rem; margin-bottom:1rem; }
      nav button, .btn { min-height:2.8rem; border:0; border-radius:999px; font:inherit; font-weight:800; cursor:pointer; }
      nav button { background:transparent; color:var(--muted); }
      nav button[aria-current="page"] { background:var(--charcoal); color:#fff; }
      .btn-primary { background:var(--lime); color:var(--charcoal); padding:.6rem 1rem; }
      .btn-ghost { background:#fff; border:1px solid var(--sand); }
      .card { background:var(--card); border:1px solid var(--sand); border-radius:1.4rem; padding:1rem; margin:.7rem 0; }
      .next { outline:4px solid var(--lime); }
      .picked { outline:4px solid var(--charcoal); }
      h1,h2,h3 { margin:.2rem 0; }
      .muted { color:var(--muted); }
      .row { display:flex; gap:.4rem; flex-wrap:wrap; }
      input[type="number"] { width:6rem; border:1px solid var(--sand); border-radius:.8rem; padding:.5rem; font:inherit; }
      .note { background:#f4e2c4; color:var(--warn); border-radius:1rem; padding:.8rem; font-weight:800; }
      a { color:var(--moss); font-weight:800; }
      section { margin-bottom:5rem; }
    </style>
  </head>
  <body>
    <div class="banner">תצוגת הדגמה — הנתונים אינם אמיתיים</div>
    <header>
      <div class="top"><strong>דוליטל</strong><strong id="who">נועה לוי</strong></div>
      <nav>
        <button type="button" id="tab-home" aria-current="page">הבית</button>
        <button type="button" id="tab-owner">יעדים</button>
      </nav>
    </header>
    <main>
      <section id="home"></section>
      <section id="owner" hidden></section>
    </main>
    <script>
      const score = 96;
      const state = {
        favorite: null,
        award: "highest",
        rows: [
          { target: 150, budget: 100, gifts: ["גלידה לדוגמה"] },
          { target: 300, budget: 250, gifts: ["ארוחת בוקר לדוגמה"] },
          { target: 500, budget: 400, gifts: ["סדנה לדוגמה"] },
        ],
        savedNote: false,
      };
      const catalog = [
        { name: "גלידה לדוגמה", price: 72, text: "חצי קילו. מתנה בדויה, בלי בית עסק אמיתי." },
        { name: "ארוחת בוקר לדוגמה", price: 198, text: "ארוחה זוגית בדויה." },
        { name: "סדנה לדוגמה", price: 280, text: "סדנה בדויה ליחיד." },
      ];

      function home() {
        const next = state.rows.find((row) => score < row.target);
        const favoriteRow = state.rows.find((row) => row.gifts.includes(state.favorite));
        const favoriteLine = !state.favorite ? "" : favoriteRow && score < favoriteRow.target
          ? `<p><b>עוד ${favoriteRow.target - score} נקודות לפרס שבחרת</b></p>`
          : `<p><b>הגעת לפרס שבחרת. הנקודות נשארות.</b></p>`;
        const cards = state.rows.map((row) => {
          const gifts = catalog.filter((gift) => gift.price <= row.budget && row.gifts.includes(gift.name));
          const items = gifts.map((gift) => {
            const picked = state.favorite === gift.name;
            return `<article class="${picked ? "picked" : ""} card"><h3>${gift.name}</h3><p>${gift.price} ₪ · ${gift.text}</p><button type="button" data-gift="${gift.name}">${picked ? "זה הפרס שבחרת" : "זה הפרס שאני רוצה"}</button><p class="muted">בחירה למוטיבציה. אין מימוש.</p></article>`;
          }).join("");
          return `<section class="card ${next && next.target === row.target ? "next" : ""}"><p class="muted">${next && next.target === row.target ? "היעד הבא" : "יעד"}</p><h2>${row.target} נקודות</h2><p><b>תקציב פרס ${row.budget} ₪</b></p><p>${score < row.target ? `עוד ${row.target - score} נקודות` : "היעד הושג. הנקודות נשארות."}</p>${items}<p>שובר בשווי ${row.budget} ₪. שובר כספי לדוגמה, לא חוויה שממומנת במלואה.</p></section>`;
        }).join("");
        document.getElementById("home").innerHTML = `
          <article class="card"><p class="muted">מוכרים רויאל קנין סטרלייז 4 ק״ג</p><h1>נמכרו ${score} נקודות</h1><p>היעדים 150, 300 ו־500 הם דוגמה בדיונית. נקודות אינן שקלים.</p>${favoriteLine}</article>
          ${cards}
          <h2>דירוג עובדים</h2>
          <p>1. נועה לוי · 96 נקודות</p><p>2. איתי מזרחי · 80 נקודות</p>
          <h2>דירוג סניפים</h2>
          <p>1. הדגמה — אשקלון פאור</p><p class="muted">אין פרס סניף. הדירוג להשוואה בלבד.</p>`;
        document.querySelectorAll("[data-gift]").forEach((button) => button.addEventListener("click", () => { state.favorite = button.dataset.gift; home(); }));
      }

      function owner() {
        const rows = state.rows.map((row, index) => `
          <div class="card">
            <label>יעד, נקודות <input data-target="${index}" type="number" value="${row.target}"></label>
            <label>תקציב ₪ <input data-budget="${index}" type="number" value="${row.budget}"></label>
            <button type="button" data-remove="${index}" class="btn btn-ghost">הסרת יעד</button>
          </div>`).join("");
        const each = state.award === "highest" ? state.rows[state.rows.length - 1].budget : state.rows.reduce((sum, row) => sum + row.budget, 0);
        const note = state.savedNote ? `<p class="note">השמירה נשארת בדפדפן הזה בלבד. היא לא משותפת ולא נשמרת בשרת.</p>` : "";
        document.getElementById("owner").innerHTML = `
          <h1>יעדים ותקציב</h1>
          <p class="muted">נקודות אינן שקלים. המתנות שמופיעות לעובד הן רק אלה שהמחיר המלא שלהן נכנס לתקציב.</p>
          ${rows}
          <button type="button" id="add" class="btn btn-ghost">יעד נוסף</button>
          <label class="card"><input type="radio" name="award" value="highest" ${state.award === "highest" ? "checked" : ""}> הפרס הגבוה ביותר שהושג. הצעה, לא כלל שאושר.</label>
          <label class="card"><input type="radio" name="award" value="sum" ${state.award === "sum" ? "checked" : ""}> כל יעד מזכה בנפרד. גם זו בחירה בטופס.</label>
          <p><b>לזוכה: ${each} ₪. זה לא התקציב.</b></p>
          <p>עלות מרבית: 6 עובדים × ${each} ₪ = ${(6 * each).toLocaleString("he-IL")} ₪.</p>
          ${note}
          <p class="muted">העלאת קבלה כבויה בתצוגה הזו.</p>
          <input type="file" disabled aria-label="העלאת קבלה כבויה">
          <p><button type="button" id="save" class="btn btn-primary">שמירה בדפדפן</button></p>`;
        document.getElementById("add").addEventListener("click", () => { read(); state.rows.push({ target: 0, budget: 0, gifts: [] }); owner(); });
        document.getElementById("save").addEventListener("click", () => { read(); state.savedNote = true; owner(); });
        document.querySelectorAll("[data-remove]").forEach((button) => button.addEventListener("click", () => {
          if (state.rows.length === 1) return;
          read(); state.rows.splice(Number(button.dataset.remove), 1); owner();
        }));
        document.querySelectorAll('input[name="award"]').forEach((input) => input.addEventListener("change", () => { state.award = input.value; owner(); }));
      }

      function read() {
        document.querySelectorAll("[data-target]").forEach((input) => { state.rows[input.dataset.target].target = Number(input.value); });
        document.querySelectorAll("[data-budget]").forEach((input) => { state.rows[input.dataset.budget].budget = Number(input.value); });
      }

      function show(which) {
        document.getElementById("home").hidden = which !== "home";
        document.getElementById("owner").hidden = which !== "owner";
        document.getElementById("tab-home").setAttribute("aria-current", which === "home" ? "page" : "false");
        document.getElementById("tab-owner").setAttribute("aria-current", which === "owner" ? "page" : "false");
        document.getElementById("who").textContent = which === "home" ? "נועה לוי" : "בעלים";
        if (which === "owner") owner();
      }
      document.getElementById("tab-home").addEventListener("click", () => show("home"));
      document.getElementById("tab-owner").addEventListener("click", () => show("owner"));
      home();
    </script>
  </body>
</html>
